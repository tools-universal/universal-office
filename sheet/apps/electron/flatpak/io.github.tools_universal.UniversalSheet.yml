# Manifesto do Flatpak do Universal Sheet (Flathub: io.github.tools_universal.UniversalSheet).
#
# Empacota o build Linux PRONTO do release (o .tar.gz do electron-builder,
# gerado pelo .github/workflows/release-desktop.yml) sobre o BaseApp do
# Electron, que traz o zypak (sandbox do Chromium dentro do Flatpak). O
# .desktop, o AppStream e o ícone vêm dentro do próprio tar.gz, em
# share/flatpak/ (ver "extraFiles" no package.json).
#
# O workflow de release anexa ao release uma cópia deste arquivo com a versão
# e os sha256 dos tar.gz preenchidos (@VERSION@, @TAG@, @SHA256_X64@,
# @SHA256_ARM64@) — é essa cópia que vai no PR para o Flathub (ver
# write/apps/electron/RELEASING.md). Build local:
#   flatpak-builder --user --install --force-clean build-dir io.github.tools_universal.UniversalSheet.yml
id: io.github.tools_universal.UniversalSheet
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '24.08'
command: universal-sheet
separate-locales: false
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # editor de arquivos: abre/salva onde o usuário escolher e grava de volta
  # no arquivo aberto (Salvar sem diálogo), inclusive em pendrive
  - --filesystem=home
  - --filesystem=/media
  - --filesystem=/run/media
modules:
  - name: universal-sheet
    buildsystem: simple
    sources:
      - type: archive
        only-arches: [x86_64]
        url: https://github.com/tools-universal/universal-office-desktop/releases/download/@TAG@/Universal-Sheet-@VERSION@-beta-x64.tar.gz
        sha256: '@SHA256_X64@'
        dest: app
      - type: archive
        only-arches: [aarch64]
        url: https://github.com/tools-universal/universal-office-desktop/releases/download/@TAG@/Universal-Sheet-@VERSION@-beta-arm64.tar.gz
        sha256: '@SHA256_ARM64@'
        dest: app
      - type: script
        dest-filename: universal-sheet.sh
        commands:
          - exec zypak-wrapper /app/universal-sheet/universal-sheet "$@"
    build-commands:
      - cp -a app "${FLATPAK_DEST}/universal-sheet"
      # o zypak faz o papel do chrome-sandbox (setuid não existe no Flatpak)
      - rm -f "${FLATPAK_DEST}/universal-sheet/chrome-sandbox"
      - install -Dm755 universal-sheet.sh "${FLATPAK_DEST}/bin/universal-sheet"
      - install -Dm644 "app/share/flatpak/${FLATPAK_ID}.desktop" "${FLATPAK_DEST}/share/applications/${FLATPAK_ID}.desktop"
      - install -Dm644 "app/share/flatpak/${FLATPAK_ID}.metainfo.xml" "${FLATPAK_DEST}/share/metainfo/${FLATPAK_ID}.metainfo.xml"
      - install -Dm644 app/share/flatpak/icon-512.png "${FLATPAK_DEST}/share/icons/hicolor/512x512/apps/${FLATPAK_ID}.png"
