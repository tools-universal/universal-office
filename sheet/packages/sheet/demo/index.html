<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <title>Universal Sheet</title>
  <style>
    /* ── Fonte da interface: Poppins (subset latin do bundle Kûara) ── */
    @font-face { font-family:'Poppins'; font-style:normal; font-weight:400; font-display:swap; src:url('fonts/poppins-400.woff2') format('woff2'); }
    @font-face { font-family:'Poppins'; font-style:normal; font-weight:500; font-display:swap; src:url('fonts/poppins-500.woff2') format('woff2'); }
    @font-face { font-family:'Poppins'; font-style:normal; font-weight:600; font-display:swap; src:url('fonts/poppins-600.woff2') format('woff2'); }
    @font-face { font-family:'Poppins'; font-style:normal; font-weight:700; font-display:swap; src:url('fonts/poppins-700.woff2') format('woff2'); }
    /* ── Substituta aberta e a fonte Normal do Excel 365 (Aptos Narrow: só local, via npm run fonts:sync) ── */
    @font-face { font-family:'Liberation Sans'; font-weight:400; font-style:normal; src:url('fonts/liberationsans-regular.ttf') format('truetype'); }
    @font-face { font-family:'Liberation Sans'; font-weight:700; font-style:normal; src:url('fonts/liberationsans-bold.ttf') format('truetype'); }
    @font-face { font-family:'Liberation Sans'; font-weight:400; font-style:italic; src:url('fonts/liberationsans-italic.ttf') format('truetype'); }
    @font-face { font-family:'Liberation Sans'; font-weight:700; font-style:italic; src:url('fonts/liberationsans-bolditalic.ttf') format('truetype'); }
    @font-face { font-family:'Aptos Narrow'; font-weight:400; font-style:normal; font-display:block; src:url('fonts/aptos-narrow-regular.ttf') format('truetype'); }
    @font-face { font-family:'Aptos Narrow'; font-weight:700; font-style:normal; font-display:block; src:url('fonts/aptos-narrow-bold.ttf') format('truetype'); }
    @font-face { font-family:'Aptos Narrow'; font-weight:400; font-style:italic; font-display:block; src:url('fonts/aptos-narrow-italic.ttf') format('truetype'); }
    @font-face { font-family:'Aptos Narrow'; font-weight:700; font-style:italic; font-display:block; src:url('fonts/aptos-narrow-bolditalic.ttf') format('truetype'); }
    /* claro/escuro: o <universal-sheet> segue o color-scheme do contexto ("light
       dark" = o do sistema); menus, barra de fórmulas, guias, status, tema e
       arrastar e soltar vêm do próprio componente (topbar/bottombar) */
    :root { color-scheme: light dark; }
    html, body { margin: 0; height: 100%; }
    universal-sheet { display: block; height: 100vh; --us-font: "Poppins", "Segoe UI", system-ui, sans-serif; }
  </style>
</head>
<body>
  <universal-sheet id="us" storage-key="sheet-demo" topbar bottombar></universal-sheet>
  <script type="module" src="./bundle.js"></script>
</body>
</html>
