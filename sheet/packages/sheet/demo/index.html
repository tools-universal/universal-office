<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <title>Universal Sheet</title>
  <style>
    /* ── Fonte da interface: Poppins (subset latin do bundle Kûara) ── */
    @font-face { font-family:'Poppins'; font-style:normal; font-weight:400; font-display:swap; src:url('fonts/poppins-400.woff2') format('woff2'); }
    @font-face { font-family:'Poppins'; font-style:normal; font-weight:500; font-display:swap; src:url('fonts/poppins-500.woff2') format('woff2'); }
    @font-face { font-family:'Poppins'; font-style:normal; font-weight:600; font-display:swap; src:url('fonts/poppins-600.woff2') format('woff2'); }
    @font-face { font-family:'Poppins'; font-style:normal; font-weight:700; font-display:swap; src:url('fonts/poppins-700.woff2') format('woff2'); }
    /* ── Fonte Normal da planilha de referência: Aptos Narrow (extraída do app de referência, sem subset) ── */
    @font-face { font-family:'Aptos Narrow'; font-weight:400; font-style:normal; font-display:block; src:url('fonts/aptos-narrow-regular.ttf') format('truetype'); }
    @font-face { font-family:'Aptos Narrow'; font-weight:700; font-style:normal; font-display:block; src:url('fonts/aptos-narrow-bold.ttf') format('truetype'); }
    @font-face { font-family:'Aptos Narrow'; font-weight:400; font-style:italic; font-display:block; src:url('fonts/aptos-narrow-italic.ttf') format('truetype'); }
    @font-face { font-family:'Aptos Narrow'; font-weight:700; font-style:italic; font-display:block; src:url('fonts/aptos-narrow-bolditalic.ttf') format('truetype'); }
    /* ── Ícones Material Symbols Rounded ── */
    @font-face { font-family:'Material Symbols Rounded'; font-style:normal; font-weight:400; font-display:block; src:url('fonts/material-symbols-rounded.woff2') format('woff2'); }
    .micon {
      font-family:'Material Symbols Rounded'; font-weight:400; font-style:normal;
      font-size:20px; line-height:1; letter-spacing:normal; text-transform:none;
      display:inline-block; white-space:nowrap; direction:ltr;
      -webkit-font-feature-settings:'liga'; -webkit-font-smoothing:antialiased;
      font-variation-settings:'opsz' 24, 'wght' 400, 'GRAD' 0, 'FILL' 0;
      pointer-events:none; user-select:none;
    }
    /* ── Tokens da app = aliases das variáveis GERADAS pelo theme generator do
         @universal-material/web (injetadas em <style id="u-theme"> via theme.ts). ── */
    :root {
      color-scheme: light;
      --md-primary: var(--u-color-primary, #1A73E8);
      --md-on-primary: var(--u-color-on-primary, #ffffff);
      --md-background: var(--u-color-surface, #faf9fd);
      --md-on-background: var(--u-color-on-surface, #1b1b1f);
      --md-surface: var(--u-color-surface, #faf9fd);
      --md-on-surface: var(--u-color-on-surface, #1b1b1f);
      --md-surface-variant: var(--u-color-surface-variant, #e1e2ec);
      --md-on-surface-variant: var(--u-color-on-surface-variant, #44474f);
      --md-surface-lowest: var(--u-color-surface-container-lowest, #ffffff);
      --md-surface-low: var(--u-color-surface-container-low, #f4f3f7);
      --md-surface-container: var(--u-color-surface-container, #efedf1);
      --md-surface-high: var(--u-color-surface-container-high, #e9e7ec);
      --md-surface-highest: var(--u-color-surface-container-highest, #e3e2e6);
      --md-outline: var(--u-color-outline, #74777f);
      --md-outline-variant: var(--u-color-outline-variant, #c4c6d0);
      --md-secondary-container: var(--u-color-secondary-container, #dbe2f9);
      --md-on-secondary-container: var(--u-color-on-secondary-container, #141b2c);
      --md-shadow: light-dark(rgba(0,0,0,.16), rgba(0,0,0,.5));
      --md-active-bg: color-mix(in srgb, var(--md-primary) 14%, transparent);

      --bg: var(--u-color-surface);
      --chrome: var(--u-color-surface-container);
      --text: var(--md-on-surface);
      --text-2: var(--md-on-surface-variant);
      --border: var(--md-outline-variant);
      --hover: var(--u-color-surface-container-highest);
      --active: var(--md-active-bg);
      --accent: var(--md-primary);
      --canvas: var(--u-color-surface-container-high);
      --shadow: 0 1px 3px var(--md-shadow);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; height: 100vh; display: flex; flex-direction: column;
      font-family: "Poppins", "Segoe UI", system-ui, sans-serif; font-size: 14px;
      background: var(--bg); color: var(--text);
    }
    /* ───── header (mesclado com a barra de título da janela) ───── */
    header {
      display: flex; align-items: center; gap: 10px;
      background: var(--u-color-surface);
      -webkit-app-region: drag; /* Electron: arrasta a janela pelo header */
      padding: 8px 16px; min-height: 48px; /* simétrico no browser */
    }
    /* SÓ no Electron: reserva a área dos controles da janela (overlay). A
       classe .electron é setada em main.ts quando a ponte (window.universalSheet)
       existe — mesmo padrão do write. */
    html.electron header {
      padding-right: calc(100vw - env(titlebar-area-width, calc(100vw - 16px)) + 16px);
    }
    header input, header button, header nav, header .head-right { -webkit-app-region: no-drag; }
    .logo {
      width: 32px; height: 32px; flex: none;
      display: inline-flex; align-items: center; justify-content: center;
      /* padrão de marca: verde; o accent do tema sobrescreve (currentColor no SVG) */
      color: var(--u-color-primary, #2E8B4E);
    }
    .logo svg { width: 100%; height: 100%; display: block; color: inherit; }
    nav.menus { display: flex; gap: 2px; font-size: 14px; }
    nav.menus > div { position: relative; }
    nav.menus button.menu {
      border: 0; background: transparent; color: var(--text); padding: 2px 8px;
      border-radius: 4px; cursor: pointer; font-size: 14px;
    }
    nav.menus button.menu:hover, nav.menus button.menu.open { background: var(--hover); }
    .dropdown {
      display: none; position: absolute; top: 26px; left: 0; z-index: 50;
      background: var(--chrome); border: 1px solid var(--border); border-radius: 8px;
      box-shadow: 0 4px 16px rgba(0,0,0,.2); padding: 6px 0; min-width: 230px;
    }
    .dropdown.show { display: block; }
    .dropdown button {
      display: flex; justify-content: space-between; gap: 24px; width: 100%;
      border: 0; background: transparent; color: var(--text); text-align: left;
      padding: 7px 18px; cursor: pointer; font-size: 14px;
    }
    .dropdown button:hover { background: var(--hover); }
    .dropdown .sep { border-top: 1px solid var(--border); margin: 6px 0; }
    .dropdown .kbd { color: var(--text-2); font-size: 12px; }
    .head-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
    header u-button, header u-icon-button { -webkit-app-region: no-drag; }
    #docTitle {
      font-size: 18px; border: 1px solid transparent; border-radius: 4px;
      padding: 1px 8px; outline: none; background: transparent; color: var(--text);
      max-width: 50vw;
    }
    #docTitle:hover { border-color: var(--border); }
    #docTitle:focus { border-color: var(--accent); }
    .accent-menu {
      position: fixed; z-index: 80; background: var(--u-color-surface-container-high);
      border: 1px solid var(--md-outline-variant); border-radius: 14px;
      box-shadow: 0 12px 32px var(--md-shadow); padding: 10px;
      display: grid; grid-template-columns: repeat(4, 32px); gap: 9px;
    }
    .accent-sw {
      width: 32px; height: 32px; border-radius: 50%; border: 2px solid transparent;
      cursor: pointer; padding: 0; position: relative; box-shadow: inset 0 0 0 1px rgba(0,0,0,.12);
    }
    .accent-sw:hover { transform: scale(1.1); }
    .accent-sw.sel { border-color: var(--md-on-surface); }
    .accent-sw.sel::after {
      content: "✓"; position: absolute; inset: 0; display: grid; place-items: center;
      color: #fff; font-size: 14px; font-weight: 700; text-shadow: 0 0 3px rgba(0,0,0,.6);
    }
    /* ───── toolbar (MD3) ───── */
    #toolbarRow { padding: 4px 16px 6px; position: relative; }
    #toolbar {
      display: flex; align-items: center; gap: 2px; min-width: 0; overflow: hidden;
      background: var(--u-color-surface-container); border-radius: 16px; padding: 7px 8px;
    }
    .tb-g { display: inline-flex; align-items: center; gap: 2px; flex: none; }
    .tb-g::before {
      content: ""; width: 1px; height: 24px; background: var(--md-outline-variant); margin: 0 7px 0 5px;
    }
    .tb-first { margin-left: 0; } .tb-first::before { display: none; }
    :has(> u-ripple) { position: relative; }
    .tb-g button, .tb-g select {
      height: 38px; min-width: 38px; border: 0; border-radius: 10px; background: transparent;
      color: var(--md-on-surface-variant); cursor: pointer; font-size: 13px; padding: 0 4px;
      font-family: inherit;
    }
    .tb-g button { display: inline-flex; align-items: center; justify-content: center; }
    .tb-g .micon { font-size: 20px; }
    .tb-g button:hover, .tb-g select:hover { background: var(--u-color-surface-container-highest); }
    .tb-g button.active { background: var(--md-active-bg); color: var(--md-primary); }
    .tb-g select { padding: 0 6px; }
    .tb-g input[type=color] { padding: 3px; width: 32px; height: 38px; border: 0; border-radius: 10px; background: transparent; cursor: pointer; }
    .tb-g input.tb-size {
      height: 34px; width: 42px; padding: 0; text-align: center;
      border: 1px solid var(--md-outline-variant); border-radius: 8px;
      background: var(--u-color-surface-container-lowest); color: var(--md-on-surface);
      font: inherit; font-size: 13px;
    }
    .tb-g input.tb-size:focus { outline: none; border-color: var(--md-primary); }
    .tb-color { position: relative; }
    .tb-color .tb-color-bar {
      position: absolute; left: 50%; transform: translateX(-50%); bottom: 5px;
      width: 18px; height: 3px; border-radius: 2px; background: #000;
    }
    /* ───── menu flutuante (dropdowns iconificados + contexto) ───── */
    .wn-menu {
      position: fixed; z-index: 120; min-width: 200px; max-height: min(70vh, 480px); overflow: auto;
      background: var(--u-color-surface-container-high); border: 1px solid var(--md-outline-variant);
      border-radius: 12px; box-shadow: 0 12px 32px var(--md-shadow); padding: 5px;
      font-size: 13.5px; color: var(--md-on-surface);
    }
    .wn-menu-item {
      display: flex; align-items: center; gap: 12px; width: 100%; height: 34px;
      padding: 0 14px 0 10px; border: 0; border-radius: 8px; background: transparent;
      color: var(--md-on-surface); cursor: pointer; font: inherit; font-size: 13.5px; text-align: left;
    }
    .wn-menu-item:hover { background: var(--u-color-surface-container-highest); }
    .wn-menu-item[disabled] { opacity: .38; pointer-events: none; }
    .wn-menu-item.checked { background: var(--md-active-bg); }
    .wn-menu-item.checked .lead { color: var(--md-primary); }
    .wn-menu-item .lead {
      width: 22px; flex: none; font-size: 19px; color: var(--md-on-surface-variant);
      display: inline-flex; align-items: center; justify-content: center;
    }
    .wn-menu-item .lead .sw { width: 16px; height: 16px; border-radius: 4px; border: 1px solid var(--md-outline-variant); }
    .wn-menu-item .lb { flex: 1 1 auto; white-space: nowrap; }
    .wn-menu-item .sc { margin-left: 24px; font-size: 11.5px; color: var(--md-on-surface-variant); opacity: .8; }
    .wn-menu-sep { height: 1px; background: var(--md-outline-variant); margin: 5px 8px; }
    u-menu-item .micon { font-size: 20px; }
    u-menu-item .u-ctx-kbd { font-size: 11.5px; opacity: .7; white-space: nowrap; }
    u-menu .u-ctx-sep { height: 1px; background: var(--md-outline-variant); margin: 4px 10px; }
    u-button, u-icon-button { display: inline-flex; vertical-align: middle; }
    /* ───── barra de fórmulas ───── */
    #formulaBar {
      display: flex; align-items: center; gap: 8px; padding: 4px 16px 8px;
      border-bottom: 1px solid var(--border); background: var(--chrome);
    }
    #fxBadge {
      display: inline-flex; align-items: center; gap: 4px; font-style: italic;
      font-weight: 600; color: var(--text-2); font-size: 13px; flex: none;
    }
    #cellRef {
      width: 90px; flex: none; height: 30px; border: 1px solid var(--md-outline-variant);
      border-radius: 8px; background: var(--md-surface-lowest); color: var(--text);
      text-align: center; font: inherit; font-size: 13px;
    }
    #cellRef:focus { outline: none; border-color: var(--md-primary); }
    #fxInput {
      flex: 1; height: 30px; border: 1px solid var(--md-outline-variant); border-radius: 8px;
      background: var(--md-surface-lowest); color: var(--text); padding: 0 10px; font: inherit; font-size: 13px;
    }
    #fxInput:focus { outline: none; border-color: var(--md-primary); }
    /* ───── editor ───── */
    #stage { flex: 1; min-height: 0; display: flex; flex-direction: column; }
    universal-sheet { flex: 1; min-height: 0; background: var(--canvas) !important; }
    /* ───── abas de planilha ───── */
    #sheetTabs {
      display: flex; align-items: center; gap: 0; padding: 0 8px;
      border-top: 1px solid var(--border); background: var(--chrome); height: 30px; flex: none;
    }
    #sheetTabs .tab {
      font: 13px/1 "Poppins"; padding: 6px 14px; background: transparent; border: 0;
      border-radius: 4px; cursor: pointer; color: var(--text-2);
    }
    #sheetTabs .tab.active { color: var(--text); font-weight: 600; box-shadow: inset 0 -2px 0 var(--accent); }
    #sheetTabs .tab:hover { background: var(--hover); }
    #sheetTabs .add { border: 0; background: transparent; color: var(--text-2); cursor: pointer; padding: 4px; border-radius: 4px; }
    #sheetTabs .add:hover { background: var(--hover); }
    /* ───── statusbar ───── */
    footer {
      display: flex; align-items: center; gap: 12px; padding: 4px 16px;
      border-top: 1px solid var(--border); background: var(--chrome);
      color: var(--text-2); font-size: 12px;
    }
    footer .views { display: flex; gap: 2px; margin-left: auto; }
    footer .views button {
      border: 0; background: transparent; color: var(--text-2); padding: 4px 8px;
      border-radius: 10px; cursor: pointer; font-size: 12px;
      display: inline-flex; align-items: center; justify-content: center;
    }
    footer .views button .micon { font-size: 19px; }
    footer .views button:hover { background: var(--hover); }
    footer .views button.active { background: var(--active); color: var(--text); }
    #dropOverlay {
      display: none; position: fixed; inset: 0; z-index: 100; background: rgba(26,115,232,.12);
      border: 3px dashed var(--accent); border-radius: 12px; margin: 12px;
      place-items: center; font-size: 22px; color: var(--accent); pointer-events: none;
    }
    #dropOverlay.show { display: grid; }
  </style>
</head>
<body>
  <header>
    <!-- Logo oficial do Universal Sheet. Tudo deriva de currentColor; a linha
         `svg{color:...}` foi removida para herdar puro do .logo, assim o tema
         (accent picker) sobrescreve a cor. Padrão de marca: verde #2E8B4E. -->
    <div class="logo" aria-label="Universal Sheet">
      <svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ícone de gráfico em alta">
        <defs>
          <style>
            #bg    stop:nth-child(1){ stop-color: color-mix(in srgb, currentColor, #fff  9%); }
            #bg    stop:nth-child(2){ stop-color: color-mix(in srgb, currentColor, #000 12%); }
            #barL  stop:nth-child(1){ stop-color: color-mix(in srgb, currentColor, #fff 46%); }
            #barL  stop:nth-child(2){ stop-color: color-mix(in srgb, currentColor, #fff 33%); }
            #barM  stop:nth-child(1){ stop-color: color-mix(in srgb, currentColor, #fff 13%); }
            #barM  stop:nth-child(2){ stop-color: color-mix(in srgb, currentColor, #fff  2%); }
            #barD  stop:nth-child(1){ stop-color: color-mix(in srgb, currentColor, #000 50%); }
            #barD  stop:nth-child(2){ stop-color: color-mix(in srgb, currentColor, #000 60%); }
            #lineG stop:nth-child(1){ stop-color: color-mix(in srgb, currentColor, #000 44%); }
            #lineG stop:nth-child(2){ stop-color: color-mix(in srgb, currentColor, #000 56%); }
            .rim   { stroke: color-mix(in srgb, currentColor, #fff 16%); }
            feDropShadow{ flood-color: color-mix(in srgb, currentColor, #000 72%); }
          </style>
          <linearGradient id="bg" x1="0.9" y1="0.1" x2="0.1" y2="0.9">
            <stop offset="0"/><stop offset="1"/>
          </linearGradient>
          <linearGradient id="barL" x1="0" y1="0" x2="0" y2="1"><stop offset="0"/><stop offset="1"/></linearGradient>
          <linearGradient id="barM" x1="0" y1="0" x2="0" y2="1"><stop offset="0"/><stop offset="1"/></linearGradient>
          <linearGradient id="barD" x1="0" y1="0" x2="0" y2="1"><stop offset="0"/><stop offset="1"/></linearGradient>
          <linearGradient id="lineG" gradientUnits="userSpaceOnUse" x1="0" y1="66" x2="0" y2="214"><stop offset="0"/><stop offset="1"/></linearGradient>
          <filter id="shSquircle" x="-20%" y="-20%" width="140%" height="160%">
            <feDropShadow dx="0" dy="10" stdDeviation="14" flood-opacity="0.28"/>
          </filter>
          <filter id="shLine" x="-40%" y="-40%" width="180%" height="180%">
            <feDropShadow dx="0" dy="4" stdDeviation="5" flood-opacity="0.32"/>
          </filter>
        </defs>
        <rect class="rim" x="32" y="28" width="448" height="448" rx="54" fill="url(#bg)" stroke-width="2.5" filter="url(#shSquircle)"/>
        <rect x="74"  y="324" width="72" height="108" rx="11" fill="url(#barD)"/>
        <rect x="166" y="232" width="74" height="200" rx="11" fill="url(#barL)"/>
        <rect x="260" y="284" width="76" height="148" rx="11" fill="url(#barM)"/>
        <rect x="356" y="174" width="72" height="258" rx="11" fill="url(#barL)"/>
        <g filter="url(#shLine)">
          <path fill="none" stroke="url(#lineG)" stroke-width="27" stroke-linejoin="round" stroke-linecap="round"
                d="M82 272 L220 150 L284 214 L401 105"/>
          <path fill="url(#lineG)" d="M444 66 L426 132 L377 79 Z"/>
        </g>
      </svg>
    </div>
    <nav class="menus">
        <div>
          <button class="menu" id="menuFile">Arquivo</button>
          <div class="dropdown" id="ddFile">
            <button id="actNew">Novo <span class="kbd"></span></button>
            <button id="actOpen">Abrir… <span class="kbd">Ctrl+O</span></button>
            <div class="sep"></div>
            <button id="actSave">Salvar <span class="kbd">Ctrl+S</span></button>
            <button id="actSaveAs">Salvar como… <span class="kbd">Ctrl+Shift+S</span></button>
            <div class="sep"></div>
            <button id="actPrint">Imprimir (PDF) <span class="kbd">Ctrl+P</span></button>
          </div>
        </div>
        <div>
          <button class="menu" id="menuInsert">Inserir</button>
          <div class="dropdown" id="ddInsert">
            <button id="actInsChart">Gráfico…</button>
            <button id="actInsFunc">Função…</button>
            <button id="actInsLink">Link…</button>
          </div>
        </div>
        <div>
          <button class="menu" id="menuFormat">Formatar</button>
          <div class="dropdown" id="ddFormat">
            <button id="actFmtCells">Células… <span class="kbd">Ctrl+1</span></button>
            <button id="actFmtRowH">Altura da linha…</button>
            <button id="actFmtColW">Largura da coluna…</button>
            <div class="sep"></div>
            <button id="actFmtSheet">Renomear planilha</button>
          </div>
        </div>
    </nav>
    <input id="docTitle" value="Pasta de trabalho sem título" spellcheck="false" title="Título da pasta" />
    <div class="head-right">
      <u-icon-button id="accentBtn" variant="standard" title="Cor de destaque"><span class="micon">palette</span></u-icon-button>
      <u-icon-button id="darkToggle" variant="standard" title="Tema"><span class="micon" id="darkToggleIcon">brightness_auto</span></u-icon-button>
      <u-button id="saveBtn" variant="filled"><span class="micon" slot="icon">save</span><span id="saveBtnLabel">Salvar .xlsx</span></u-button>
    </div>
  </header>
  <div id="accentMenu" class="accent-menu" style="display:none">
    <button class="accent-sw" data-accent="neutral" title="Padrão (preto/branco)" style="background:linear-gradient(135deg,#111 0 50%,#fff 50% 100%)"></button>
    <button class="accent-sw" data-accent="teal" title="Teal" style="background:#1F7A75"></button>
    <button class="accent-sw" data-accent="blue" title="Azul" style="background:#1A73E8"></button>
    <button class="accent-sw" data-accent="green" title="Verde" style="background:#3F8E3F"></button>
    <button class="accent-sw" data-accent="amber" title="Âmbar" style="background:#A6791F"></button>
    <button class="accent-sw" data-accent="red" title="Vermelho" style="background:#C0392B"></button>
    <button class="accent-sw" data-accent="purple" title="Roxo" style="background:#6750A4"></button>
  </div>

  <div id="toolbarRow">
  <div id="toolbar">
    <div class="tb-g tb-first">
      <button id="undo" title="Desfazer (Ctrl+Z)"><span class="micon">undo</span></button>
      <button id="redo" title="Refazer (Ctrl+Y)"><span class="micon">redo</span></button>
      <button id="print" title="Imprimir (Ctrl+P)"><span class="micon">print</span></button>
      <button id="zoomMenu" class="tb-g" style="min-width:54px;justify-content:center" title="Zoom"><span style="font-size:13px;font-weight:600" id="zoomNum">100%</span><span class="micon" style="font-size:14px;opacity:.6">arrow_drop_down</span></button>
    </div>
    <div class="tb-g">
      <select id="font" title="Fonte"><option>Aptos Narrow</option><option>Calibri</option><option>Arial</option></select>
    </div>
    <div class="tb-g">
      <button id="shrink" title="Diminuir fonte"><span class="micon">remove</span></button>
      <input id="size" class="tb-size" type="text" inputmode="numeric" maxlength="3" value="11" title="Tamanho da fonte" />
      <button id="grow" title="Aumentar fonte"><span class="micon">add</span></button>
    </div>
    <div class="tb-g">
      <button id="bold" title="Negrito (Ctrl+B)"><span class="micon">format_bold</span></button>
      <button id="italic" title="Itálico (Ctrl+I)"><span class="micon">format_italic</span></button>
      <button id="underline" title="Sublinhado (Ctrl+U)"><span class="micon">format_underlined</span></button>
      <button id="colorBtn" class="tb-color" title="Cor do texto"><span class="micon">format_color_text</span><span class="tb-color-bar" id="colorBar"></span></button>
      <input type="color" id="color" value="#000000" style="display:none" />
    </div>
    <div class="tb-g">
      <button id="fillBtn" class="tb-color" title="Cor de preenchimento"><span class="micon">format_color_fill</span><span class="tb-color-bar" id="fillBar" style="background:transparent"></span></button>
      <input type="color" id="fill" value="#ffffff" style="display:none" />
      <button id="borders" title="Bordas"><span class="micon">border_all</span></button>
      <button id="merge" title="Mesclar e centralizar"><span class="micon">call_merge</span></button>
    </div>
    <div class="tb-g">
      <button id="alignMenu" title="Alinhamento"><span class="micon">format_align_left</span></button>
      <button id="valignMenu" title="Alinhamento vertical"><span class="micon">vertical_align_bottom</span></button>
      <button id="wrap" title="Quebrar texto"><span class="micon">wrap_text</span></button>
    </div>
    <div class="tb-g">
      <button id="numFmtMenu" title="Formato de número"><span class="micon">calendar_view_day</span></button>
      <button id="percent" title="Porcentagem"><span class="micon">percent</span></button>
      <button id="currency" title="Moeda"><span class="micon">attach_money</span></button>
    </div>
    <div class="tb-g">
      <button id="condFormat" title="Formatação condicional"><span class="micon">palette</span></button>
      <button id="filter" title="Filtro"><span class="micon">filter_alt</span></button>
    </div>
    <input type="file" id="xlsxFile" accept=".xlsx" style="display:none" />
  </div>
  </div>

  <div id="formulaBar">
    <span id="fxBadge"><span class="micon" style="font-size:16px">function</span>fx</span>
    <input id="cellRef" value="A1" spellcheck="false" />
    <input id="fxInput" placeholder="Selecione uma célula para editar o conteúdo" spellcheck="false" />
  </div>

  <div id="stage">
    <universal-sheet id="us"></universal-sheet>
    <div id="sheetTabs"></div>
  </div>

  <footer>
    <span id="status">Pronto</span>
    <div class="views">
      <button data-view="normal" class="active" title="Normal"><span class="micon">grid_on</span></button>
      <button data-view="page" title="Layout da página"><span class="micon">description</span></button>
      <button data-view="preview" title="Visualizar impressão"><span class="micon">print</span></button>
    </div>
    <span style="display:flex;align-items:center;gap:8px">
      <button id="zoomOut" title="Reduzir" style="border:0;background:transparent;color:var(--text-2);cursor:pointer">−</button>
      <input type="range" id="zoom" min="40" max="300" value="100" step="5" title="Zoom" style="width:130px;accent-color:var(--accent)" />
      <button id="zoomIn" title="Ampliar" style="border:0;background:transparent;color:var(--text-2);cursor:pointer">+</button>
      <span id="zoomLabel" style="min-width:42px;text-align:right">100%</span>
    </span>
  </footer>

  <div id="dropOverlay">Solte o .xlsx para abrir</div>
  <script type="module" src="./bundle.js"></script>
</body>
</html>
