name: Release desktop

# Builds the Universal Office (Beta) desktop app — the suite with the three
# editors (Universal Write, Universal Sheet and Universal Slides) in one
# Electron app, see desktop/ — for Windows, macOS and Linux on the native
# runners and publishes a release (draft, marked as pre-release: the app is in
# beta) in this repository.
#
# How to run it: push the tag with the app version (desktop/package.json):
#   git tag desktop-v0.9.2 && git push origin desktop-v0.9.2
# or run it by hand (Actions → Release desktop → Run workflow) with the tag.
# The draft becomes public when you publish it on the Releases page.
#
# Artifacts (see desktop/RELEASING.md):
#   Windows  Universal-Office-<version>-beta-Setup.exe (NSIS; Universal
#            Write/Sheet/Slides (Beta) shortcuts in the Start menu and on the desktop)
#   macOS    Universal-Office-<version>-beta-arm64.dmg and -x64.dmg
#   Linux    Universal-Office-<version>-beta-{x86_64,arm64}.AppImage, -{amd64,arm64}.deb,
#            -{x86_64,aarch64}.rpm, -{x64,arm64}.tar.gz,
#            universal-office_<version>_amd64.snap (Snap Store) and the Flatpak
#            manifest (with the sha256 of the tar.gz, the AppStream metadata and
#            the three .desktop files)
# Nothing is published to the stores from here: Snap Store, Flathub and
# AppImageHub depend on the owner's accounts (see desktop/RELEASING.md).
#
# Secrets:
#   SUBMODULES_TOKEN  — (optional) PAT with read access to tools-universal/office-converter,
#                       if the vendor/office-converter submodule is private.
#   The release itself uses the workflow's GITHUB_TOKEN (contents: write).
#
# Signing: the builds are NOT signed (macOS shows the Gatekeeper warning and
# Windows SmartScreen). To sign, add the certificates as secrets and configure
# win.certificateFile / mac notarization in desktop/package.json.

on:
  push:
    tags: ['desktop-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. desktop-v0.9.2)'
        required: true

permissions:
  contents: read

env:
  FLATPAK_ID: org.universaloffice.UniversalOffice

jobs:
  setup:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.r.outputs.tag }}
      version: ${{ steps.r.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: r
        shell: bash
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          case "$tag" in desktop-v*) ;; *) echo "::error::tag '$tag' (use desktop-v<version>)"; exit 1 ;; esac
          version=$(node -p "require('./desktop/package.json').version")
          if [ "${tag#desktop-v}" != "$version" ]; then
            echo "::error::tag $tag does not match version $version in desktop/package.json"; exit 1
          fi
          { echo "tag=$tag"; echo "version=$version"; } >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.os }})
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      # unsigned builds: do not look for a signing certificate
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Linux packaging tools (rpm)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm

      # the demo bundles import the converter (submodule) and the shared
      # packages from source: install each one, as install:all does
      - name: Install shared packages and the product workspaces
        shell: bash
        run: |
          npm run install:converter
          npm run install:fonts
          npm run install:charts
          npm run install:drawingml
          npm run install:ui
          npm run install:spell
          npm install --prefix write
          npm install --prefix sheet
          npm install --prefix slides
          npm ci --prefix desktop

      - name: Build the editor pages (demo bundles of Write, Sheet and Slides)
        run: npm --prefix desktop run build:demos

      - name: Build installers (electron-builder)
        run: npm --prefix desktop run dist

      - name: Build snap (Snap Store)
        if: runner.os == 'Linux'
        run: npm --prefix desktop run dist:linux-stores

      - name: Fill in the Flatpak manifest (version, tag, sha256 of the tar.gz)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          v='${{ needs.setup.outputs.version }}'
          art="Universal-Office-$v-beta"
          x64=$(sha256sum "desktop/dist/$art-x64.tar.gz" | cut -d' ' -f1)
          arm=$(sha256sum "desktop/dist/$art-arm64.tar.gz" | cut -d' ' -f1)
          sed -e "s/@VERSION@/$v/g" -e "s/@TAG@/${{ needs.setup.outputs.tag }}/g" \
              -e "s/@SHA256_X64@/$x64/" -e "s/@SHA256_ARM64@/$arm/" \
              "desktop/flatpak/$FLATPAK_ID.yml" > "desktop/dist/$FLATPAK_ID.yml"
          cp desktop/flatpak/$FLATPAK_ID*.desktop desktop/flatpak/$FLATPAK_ID.metainfo.xml desktop/dist/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          if-no-files-found: warn
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.AppImage
            desktop/dist/*.deb
            desktop/dist/*.rpm
            desktop/dist/*.tar.gz
            desktop/dist/*.snap
            desktop/dist/org.universaloffice.*
            desktop/dist/*.blockmap

  release:
    name: Publish release (draft)
    needs: [setup, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish (draft, pre-release) in this repository
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.setup.outputs.tag }}
          name: Universal Office ${{ needs.setup.outputs.version }} (Beta)
          draft: true
          prerelease: true
          generate_release_notes: false
          fail_on_unmatched_files: false
          files: artifacts/**/*
