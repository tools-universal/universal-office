name: Release desktop

# Builda o app desktop Universal Office (Beta) — a suíte com os três editores
# (Universal Write, Universal Sheet e Universal Slides) num só app Electron,
# ver desktop/ — para Windows, macOS e Linux nos runners nativos e publica um
# release (draft, marcado como pré-release: o app é beta) no repositório de
# releases tools-universal/universal-office-desktop.
#
# Como disparar: a tag com a versão do app (desktop/package.json):
#   git tag desktop-v0.9.2 && git push origin desktop-v0.9.2
# ou rode manualmente (Actions → Release desktop → Run workflow) informando a tag.
#
# Artefatos (ver desktop/RELEASING.md):
#   Windows  Universal-Office-<versão>-beta-Setup.exe (NSIS; atalhos Universal
#            Write/Sheet/Slides (Beta) no menu Iniciar e na área de trabalho)
#   macOS    Universal-Office-<versão>-beta-arm64.dmg e -x64.dmg
#   Linux    Universal-Office-<versão>-beta-{x86_64,arm64}.AppImage, -{amd64,arm64}.deb,
#            -{x86_64,aarch64}.rpm, -{x64,arm64}.tar.gz,
#            universal-office_<versão>_amd64.snap (Snap Store) e o manifesto do
#            Flatpak (io.github.tools_universal.UniversalOffice.yml, com os
#            sha256 dos tar.gz, + o AppStream e os três .desktop)
# Nada é publicado nas lojas daqui: Snap Store, Flathub e AppImageHub dependem
# das contas do dono (ver RELEASING.md).
#
# Secrets:
#   RELEASE_TOKEN     — PAT (fine-grained com "Contents: write" no repo
#                       universal-office-desktop, ou classic com escopo "repo").
#                       O GITHUB_TOKEN só publica no próprio repo.
#   SUBMODULES_TOKEN  — (opcional) PAT com leitura em tools-universal/office-converter,
#                       se o submódulo vendor/office-converter for privado.
#
# Assinatura: os builds saem NÃO assinados (macOS mostra aviso do Gatekeeper e
# Windows o SmartScreen). Para assinar, adicione os certificados como secrets e
# configure win.certificateFile / mac notarization em desktop/package.json.

on:
  push:
    tags: ['desktop-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (ex.: desktop-v0.9.2)'
        required: true

permissions:
  contents: read

env:
  FLATPAK_ID: io.github.tools_universal.UniversalOffice

jobs:
  setup:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.r.outputs.tag }}
      version: ${{ steps.r.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: r
        shell: bash
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          case "$tag" in desktop-v*) ;; *) echo "::error::tag '$tag' (use desktop-v<versão>)"; exit 1 ;; esac
          version=$(node -p "require('./desktop/package.json').version")
          if [ "${tag#desktop-v}" != "$version" ]; then
            echo "::error::a tag $tag não bate com a versão $version de desktop/package.json"; exit 1
          fi
          { echo "tag=$tag"; echo "version=$version"; } >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.os }})
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      # builds não assinados — não tenta descobrir/usar um certificado
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Linux packaging tools (rpm)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm

      # os bundles dos demos importam o conversor (submódulo) e os pacotes
      # compartilhados pelo código-fonte: instala cada um, como o install:all
      - name: Install shared packages and the product workspaces
        shell: bash
        run: |
          npm run install:converter
          npm run install:fonts
          npm run install:charts
          npm run install:drawingml
          npm run install:ui
          npm run install:spell
          npm install --prefix write
          npm install --prefix sheet
          npm install --prefix slides
          npm ci --prefix desktop

      - name: Build the editor pages (demo bundles of Write, Sheet and Slides)
        run: npm --prefix desktop run build:demos

      - name: Build installers (electron-builder)
        run: npm --prefix desktop run dist

      - name: Build snap (Snap Store)
        if: runner.os == 'Linux'
        run: npm --prefix desktop run dist:linux-stores

      - name: Fill in the Flatpak manifest (version, tag, sha256 of the tar.gz)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          v='${{ needs.setup.outputs.version }}'
          art="Universal-Office-$v-beta"
          x64=$(sha256sum "desktop/dist/$art-x64.tar.gz" | cut -d' ' -f1)
          arm=$(sha256sum "desktop/dist/$art-arm64.tar.gz" | cut -d' ' -f1)
          sed -e "s/@VERSION@/$v/g" -e "s/@TAG@/${{ needs.setup.outputs.tag }}/g" \
              -e "s/@SHA256_X64@/$x64/" -e "s/@SHA256_ARM64@/$arm/" \
              "desktop/flatpak/$FLATPAK_ID.yml" > "desktop/dist/$FLATPAK_ID.yml"
          cp desktop/flatpak/$FLATPAK_ID*.desktop desktop/flatpak/$FLATPAK_ID.metainfo.xml desktop/dist/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          if-no-files-found: warn
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.AppImage
            desktop/dist/*.deb
            desktop/dist/*.rpm
            desktop/dist/*.tar.gz
            desktop/dist/*.snap
            desktop/dist/io.github.tools_universal.*
            desktop/dist/*.blockmap

  release:
    name: Publish release (draft)
    needs: [setup, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish (draft, pre-release) to universal-office-desktop
        uses: softprops/action-gh-release@v2
        with:
          repository: tools-universal/universal-office-desktop
          token: ${{ secrets.RELEASE_TOKEN }}
          tag_name: ${{ needs.setup.outputs.tag }}
          name: Universal Office ${{ needs.setup.outputs.version }} (Beta)
          draft: true
          prerelease: true
          generate_release_notes: false
          fail_on_unmatched_files: false
          files: artifacts/**/*
