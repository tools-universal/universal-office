# Flatpak manifest of the Universal Office (Beta) suite — Flathub:
# org.universaloffice.UniversalOffice. One app, three launchers:
#   org.universaloffice.UniversalOffice.desktop         Universal Write (Beta)
#   org.universaloffice.UniversalOffice.Sheet.desktop   Universal Sheet (Beta)
#   org.universaloffice.UniversalOffice.Slides.desktop  Universal Slides (Beta)
# (Flathub requires the .desktop named after the app; the others are prefixed by it).
#
# Packages the READY Linux build of the release (the electron-builder .tar.gz,
# built by .github/workflows/release-desktop.yml) on top of the Electron
# BaseApp, which brings zypak (the Chromium sandbox inside Flatpak). The
# .desktop files, the AppStream metadata and the icons come inside the tar.gz
# itself, in share/flatpak/ (see "extraFiles" in package.json).
#
# The release workflow attaches to the release a copy of this file with the
# version and the sha256 of the tar.gz filled in (@VERSION@, @TAG@, @SHA256_X64@,
# @SHA256_ARM64@) — that copy is the one that goes in the Flathub PR (see
# desktop/RELEASING.md). Local build:
#   flatpak-builder --user --install --force-clean build-dir org.universaloffice.UniversalOffice.yml
id: org.universaloffice.UniversalOffice
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '24.08'
command: universal-office
separate-locales: false
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # file editor: opens/saves wherever the user chooses and writes back to the
  # open file (Save without a dialog), including on removable drives
  - --filesystem=home
  - --filesystem=/media
  - --filesystem=/run/media
modules:
  - name: universal-office
    buildsystem: simple
    sources:
      - type: archive
        only-arches: [x86_64]
        url: https://github.com/erichideyuki/universal-office/releases/download/@TAG@/Universal-Office-@VERSION@-beta-x64.tar.gz
        sha256: '@SHA256_X64@'
        dest: app
      - type: archive
        only-arches: [aarch64]
        url: https://github.com/erichideyuki/universal-office/releases/download/@TAG@/Universal-Office-@VERSION@-beta-arm64.tar.gz
        sha256: '@SHA256_ARM64@'
        dest: app
      - type: script
        dest-filename: universal-office.sh
        commands:
          - exec zypak-wrapper /app/universal-office/universal-office "$@"
    build-commands:
      - cp -a app "${FLATPAK_DEST}/universal-office"
      # zypak plays the role of chrome-sandbox (there is no setuid in Flatpak)
      - rm -f "${FLATPAK_DEST}/universal-office/chrome-sandbox"
      - install -Dm755 universal-office.sh "${FLATPAK_DEST}/bin/universal-office"
      - install -Dm644 "app/share/flatpak/${FLATPAK_ID}.metainfo.xml" "${FLATPAK_DEST}/share/metainfo/${FLATPAK_ID}.metainfo.xml"
      - |
        for e in ":write" ".Sheet:sheet" ".Slides:slides"; do
          suf="${e%%:*}"; kind="${e##*:}"
          install -Dm644 "app/share/flatpak/${FLATPAK_ID}${suf}.desktop" "${FLATPAK_DEST}/share/applications/${FLATPAK_ID}${suf}.desktop"
          install -Dm644 "app/share/flatpak/icons/${kind}.png" "${FLATPAK_DEST}/share/icons/hicolor/512x512/apps/${FLATPAK_ID}${suf}.png"
        done
