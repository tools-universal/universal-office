# Manifesto do Flatpak da suíte Universal Office (Beta) — Flathub:
# io.github.erichideyuki.UniversalOffice. Um app, três lançadores:
#   io.github.erichideyuki.UniversalOffice.desktop         Universal Write (Beta)
#   io.github.erichideyuki.UniversalOffice.Sheet.desktop   Universal Sheet (Beta)
#   io.github.erichideyuki.UniversalOffice.Slides.desktop  Universal Slides (Beta)
# (o Flathub exige o .desktop com o nome do app; os outros, prefixados por ele).
#
# Empacota o build Linux PRONTO do release (o .tar.gz do electron-builder,
# gerado pelo .github/workflows/release-desktop.yml) sobre o BaseApp do
# Electron, que traz o zypak (sandbox do Chromium dentro do Flatpak). Os
# .desktop, o AppStream e os ícones vêm dentro do próprio tar.gz, em
# share/flatpak/ (ver "extraFiles" no package.json).
#
# O workflow de release anexa ao release uma cópia deste arquivo com a versão
# e os sha256 dos tar.gz preenchidos (@VERSION@, @TAG@, @SHA256_X64@,
# @SHA256_ARM64@) — é essa cópia que vai no PR para o Flathub (ver
# desktop/RELEASING.md). Build local:
#   flatpak-builder --user --install --force-clean build-dir io.github.erichideyuki.UniversalOffice.yml
id: io.github.erichideyuki.UniversalOffice
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '24.08'
command: universal-office
separate-locales: false
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # editor de arquivos: abre/salva onde o usuário escolher e grava de volta
  # no arquivo aberto (Salvar sem diálogo), inclusive em pendrive
  - --filesystem=home
  - --filesystem=/media
  - --filesystem=/run/media
modules:
  - name: universal-office
    buildsystem: simple
    sources:
      - type: archive
        only-arches: [x86_64]
        url: https://github.com/erichideyuki/universal-office/releases/download/@TAG@/Universal-Office-@VERSION@-beta-x64.tar.gz
        sha256: '@SHA256_X64@'
        dest: app
      - type: archive
        only-arches: [aarch64]
        url: https://github.com/erichideyuki/universal-office/releases/download/@TAG@/Universal-Office-@VERSION@-beta-arm64.tar.gz
        sha256: '@SHA256_ARM64@'
        dest: app
      - type: script
        dest-filename: universal-office.sh
        commands:
          - exec zypak-wrapper /app/universal-office/universal-office "$@"
    build-commands:
      - cp -a app "${FLATPAK_DEST}/universal-office"
      # o zypak faz o papel do chrome-sandbox (setuid não existe no Flatpak)
      - rm -f "${FLATPAK_DEST}/universal-office/chrome-sandbox"
      - install -Dm755 universal-office.sh "${FLATPAK_DEST}/bin/universal-office"
      - install -Dm644 "app/share/flatpak/${FLATPAK_ID}.metainfo.xml" "${FLATPAK_DEST}/share/metainfo/${FLATPAK_ID}.metainfo.xml"
      - |
        for e in ":write" ".Sheet:sheet" ".Slides:slides"; do
          suf="${e%%:*}"; kind="${e##*:}"
          install -Dm644 "app/share/flatpak/${FLATPAK_ID}${suf}.desktop" "${FLATPAK_DEST}/share/applications/${FLATPAK_ID}${suf}.desktop"
          install -Dm644 "app/share/flatpak/icons/${kind}.png" "${FLATPAK_DEST}/share/icons/hicolor/512x512/apps/${FLATPAK_ID}${suf}.png"
        done
