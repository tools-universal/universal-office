<!DOCTYPE html>
<!-- Página de TESTE do <universal-presentation-viewer> isolado: abrir .pptx/.ppt
     (botão, arrastar e soltar ou amostras do repositório), navegar, apresentar
     (F5) e reproduzir com intervalos. Build: npm run build:demo -w @universal/presentation-viewer -->
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <title>Viewer — teste</title>
  <!-- fontes do demo do editor: Aptos (fonte de nuvem do Office) + Liberation + fontes do SO dos decks -->
  <link rel="stylesheet" href="../../slides/demo/fonts/os-fonts.css" />
  <style>
    @font-face { font-family: 'Aptos'; src: url('../../slides/demo/fonts/aptos-regular.ttf'); font-weight: 400; font-style: normal; }
    @font-face { font-family: 'Aptos'; src: url('../../slides/demo/fonts/aptos-bold.ttf'); font-weight: 700; font-style: normal; }
    @font-face { font-family: 'Aptos'; src: url('../../slides/demo/fonts/aptos-italic.ttf'); font-weight: 400; font-style: italic; }
    @font-face { font-family: 'Aptos'; src: url('../../slides/demo/fonts/aptos-bolditalic.ttf'); font-weight: 700; font-style: italic; }
    @font-face { font-family: 'Liberation Sans'; src: url('../../slides/demo/fonts/liberationsans-regular.ttf'); font-weight: 400; font-style: normal; }
    @font-face { font-family: 'Liberation Sans'; src: url('../../slides/demo/fonts/liberationsans-bold.ttf'); font-weight: 700; font-style: normal; }
    @font-face { font-family: 'Liberation Sans'; src: url('../../slides/demo/fonts/liberationsans-italic.ttf'); font-weight: 400; font-style: italic; }
    @font-face { font-family: 'Liberation Sans'; src: url('../../slides/demo/fonts/liberationsans-bolditalic.ttf'); font-weight: 700; font-style: italic; }
    :root {
      --bg: #1e1e22; --panel: #26262b; --panel-2: #2e2e34; --border: #3a3a42;
      --text: #e8e6ec; --text-2: #a9a7b0; --accent: #ff8a65; --error: #ff6b6b;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; display: grid; grid-template-rows: auto 1fr auto; height: 100vh;
      background: var(--bg); color: var(--text); font: 13px/1.4 "Segoe UI", system-ui, sans-serif;
    }
    header {
      display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
      padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--border);
    }
    header h1 { font-size: 14px; font-weight: 600; margin: 0 6px 0 0; }
    .sep { width: 1px; align-self: stretch; background: var(--border); margin: 0 4px; }
    button, select, input[type=number] {
      font: inherit; color: var(--text); background: var(--panel-2);
      border: 1px solid var(--border); border-radius: 6px; padding: 4px 10px;
    }
    button { cursor: pointer; }
    button:hover:not(:disabled) { border-color: var(--accent); }
    button:disabled { opacity: .45; cursor: default; }
    button.primary { background: var(--accent); border-color: var(--accent); color: #1b0c06; font-weight: 600; }
    input[type=number] { width: 56px; padding: 4px 6px; }
    label { display: inline-flex; align-items: center; gap: 5px; color: var(--text-2); }
    #fileName { color: var(--text-2); max-width: 280px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #counter { min-width: 56px; text-align: center; font-variant-numeric: tabular-nums; }
    main { display: grid; grid-template-columns: 170px 1fr; min-height: 0; }
    #thumbs {
      overflow-y: auto; padding: 8px; background: var(--panel); border-right: 1px solid var(--border);
      display: flex; flex-direction: column; gap: 8px;
    }
    .thumb { display: grid; grid-template-columns: 18px 1fr; gap: 4px; align-items: start; cursor: pointer; color: var(--text-2); }
    .thumb canvas { width: 100%; aspect-ratio: 16 / 9; display: block; border: 2px solid transparent; border-radius: 3px; background: #444; }
    .thumb.hidden canvas { opacity: .45; }
    .thumb.current { color: var(--text); }
    .thumb.current canvas { border-color: var(--accent); }
    #stage { position: relative; min-width: 0; min-height: 0; }
    universal-presentation-viewer { position: absolute; inset: 0; }
    #drop {
      position: absolute; inset: 12px; display: none; place-items: center; z-index: 5;
      border: 2px dashed var(--accent); border-radius: 12px; background: rgba(30, 30, 34, .85);
      font-size: 18px; pointer-events: none;
    }
    body.dragging #drop { display: grid; }
    #empty {
      position: absolute; inset: 0; display: grid; place-items: center; text-align: center;
      color: var(--text-2); pointer-events: none;
    }
    #empty strong { color: var(--text); font-size: 16px; }
    footer {
      display: flex; gap: 12px; align-items: center; padding: 5px 12px;
      background: var(--panel); border-top: 1px solid var(--border); color: var(--text-2); min-height: 28px;
    }
    footer .error { color: var(--error); }
    footer kbd { font: 11px Consolas, monospace; border: 1px solid var(--border); border-radius: 4px; padding: 0 4px; }
    #status { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  </style>
</head>
<body>
  <header>
    <h1>Viewer — teste</h1>
    <button id="open" class="primary" title="Abrir .pptx ou .ppt (ou arraste o arquivo para a página)">Abrir arquivo…</button>
    <input id="file" type="file" accept=".pptx,.ppt,.pptm,.ppsx,.pps" hidden />
    <select id="samples" title="Decks de exemplo do repositório"><option value="">Amostras…</option></select>
    <span id="fileName"></span>
    <span class="sep"></span>
    <button id="prev" title="Slide anterior (←)" disabled>◀</button>
    <span id="counter">–</span>
    <button id="next" title="Próximo slide (→)" disabled>▶</button>
    <span class="sep"></span>
    <button id="play" title="Reprodução automática a partir do slide atual (P)" disabled>▶ Reproduzir</button>
    <label title="Avança sozinho pelos intervalos gravados (reprodução e apresentação); desligado: a reprodução usa só a duração padrão e a apresentação só o clique"><input id="useTimings" type="checkbox" checked /> intervalos</label>
    <label title="Duração de slides sem intervalo gravado">padrão <input id="defaultSec" type="number" min="0.5" max="60" step="0.5" value="3" /> s</label>
    <label title="Depois do último slide, volta ao primeiro (reprodução e apresentação)"><input id="loop" type="checkbox" /> repetir</label>
    <span class="sep"></span>
    <button id="full" title="Apresentar a partir do slide atual, como o F5 do PowerPoint: clique/→ avança, ← volta, Esc sai (F · F5 do início · Shift+F5 do atual)" disabled>⛶ Apresentar</button>
  </header>

  <main>
    <aside id="thumbs"></aside>
    <section id="stage">
      <universal-presentation-viewer id="pv"></universal-presentation-viewer>
      <div id="empty"><div><strong>Nenhum arquivo aberto</strong><br />Abra ou arraste um .pptx / .ppt, ou escolha uma amostra.</div></div>
      <div id="drop">Solte o .pptx / .ppt aqui</div>
    </section>
  </main>

  <footer>
    <span id="status">Pronto</span>
    <span><kbd>F5</kbd> apresentar · <kbd>←</kbd><kbd>→</kbd> navegar · <kbd>P</kbd> reproduzir/parar · <kbd>Esc</kbd> sair/parar</span>
  </footer>

  <script type="module" src="./bundle.js"></script>
</body>
</html>
