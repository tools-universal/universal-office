<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Universal Slides</title>
  <link rel="stylesheet" href="./fonts/os-fonts.css" />
  <style>
    /* Aptos (cloud font do Office) embarcada — métricas de texto 1:1 com o
       app de referência mesmo sem a fonte instalada no sistema. */
    @font-face { font-family: 'Liberation Sans'; src: url('./fonts/liberationsans-regular.ttf'); font-weight: 400; font-style: normal; }
    @font-face { font-family: 'Liberation Sans'; src: url('./fonts/liberationsans-bold.ttf'); font-weight: 700; font-style: normal; }
    @font-face { font-family: 'Liberation Sans'; src: url('./fonts/liberationsans-italic.ttf'); font-weight: 400; font-style: italic; }
    @font-face { font-family: 'Liberation Sans'; src: url('./fonts/liberationsans-bolditalic.ttf'); font-weight: 700; font-style: italic; }
    @font-face { font-family: 'Aptos'; src: url('./fonts/aptos-regular.ttf'); font-weight: 400; font-style: normal; }
    @font-face { font-family: 'Aptos'; src: url('./fonts/aptos-bold.ttf'); font-weight: 700; font-style: normal; }
    @font-face { font-family: 'Aptos'; src: url('./fonts/aptos-italic.ttf'); font-weight: 400; font-style: italic; }
    @font-face { font-family: 'Aptos'; src: url('./fonts/aptos-bolditalic.ttf'); font-weight: 700; font-style: italic; }
    html, body { margin: 0; height: 100%; }
    /* claro/escuro: o <universal-slides> segue o color-scheme do contexto —
       `light dark` acompanha o SO (também no shell Electron); Exibir › Tema
       escolhe Automático/Claro/Escuro (gravado por instância: storage-key;
       sem o atributo theme, a escolha vale também depois de recarregar) */
    :root { color-scheme: light dark; }
    /* o demo só hospeda o componente: barras (compacta ou ribbon), miniaturas,
       anotações, menus, diálogos, apresentação, tema e arrastar e soltar vêm
       do próprio <universal-slides> */
    universal-slides { display: block; height: 100vh; }
  </style>
</head>
<body>
  <universal-slides id="us" storage-key="slides-demo" fonts="./fonts" topbar bottombar></universal-slides>
  <script type="module" src="./bundle.js"></script>
</body>
</html>
