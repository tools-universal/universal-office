<!DOCTYPE html>
<!-- Harness de comparação 1:1: renderiza cada slide de um .pptx (query ?pptx=)
     em canvas de TAMANHO EXATO via <universal-presentation-viewer>
     (renderSlideToCanvas — sem margens/chrome). Usado por render-deck.mjs. -->
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <title>ppt-lab harness</title>
  <style>
    /* Aptos do CloudFonts do Office — o Chromium NÃO enxerga cloud fonts do
       sistema; sem isso o fallback Segoe UI muda as métricas de texto. */
    @font-face { font-family: 'Aptos'; src: url('./fonts/aptos-regular.ttf'); font-weight: 400; font-style: normal; }
    @font-face { font-family: 'Aptos'; src: url('./fonts/aptos-bold.ttf'); font-weight: 700; font-style: normal; }
    @font-face { font-family: 'Aptos'; src: url('./fonts/aptos-italic.ttf'); font-weight: 400; font-style: italic; }
    @font-face { font-family: 'Aptos'; src: url('./fonts/aptos-bolditalic.ttf'); font-weight: 700; font-style: italic; }
    body { margin: 0; background: #fff; } canvas { display: block; }
  </style>
</head>
<body>
  <universal-presentation-viewer id="pv" style="position:absolute;left:-10000px;width:800px;height:450px"></universal-presentation-viewer>
  <canvas id="cv"></canvas>
  <script type="module" src="./harness.bundle.js"></script>
</body>
</html>
