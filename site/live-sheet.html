<!doctype html>
<html lang="en" class="live-page">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Universal Sheet — live editor</title>
  <meta name="description" content="Run the <universal-sheet> editor live in your browser — open, edit, and save .xlsx with Excel's look and a formula engine that recalculates on every edit." />
  <link rel="icon" type="image/svg+xml" href="assets/icons/universal-office.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" />
  <link rel="stylesheet" href="assets/style.css" />
  <script src="assets/theme.js?v=3"></script>
</head>
<body>

  <div class="live-bar">
    <a class="brand" href="index.html">
      <img src="assets/icons/universal-office.svg" alt="" />
      Universal Office
    </a>
    <span class="tag">Live</span>
    <nav class="live-switch" aria-label="Editors">
      <a href="live.html"><img src="assets/icons/write.svg" alt="" />Write</a>
      <a href="live-sheet.html" aria-current="page"><img src="assets/icons/sheet.svg" alt="" />Sheet</a>
      <a href="live-slides.html"><img src="assets/icons/slides.svg" alt="" />Slides</a>
    </nav>
    <span class="spacer"></span>
    <nav>
      <a href="docs/sheet/index.html">Documentation</a>
      <a href="index.html">← Back to site</a>
    </nav>
    <div class="theme-switch" role="group" aria-label="Theme">
      <button type="button" data-theme="auto" title="Auto (system)" aria-label="Auto theme"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg></button>
      <button type="button" data-theme="light" title="Light" aria-label="Light theme"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
      <button type="button" data-theme="dark" title="Dark" aria-label="Dark theme"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
    </div>
  </div>

  <universal-sheet id="us" class="live-editor" topbar bottombar></universal-sheet>

  <script type="module">
    import { FontResolver, openWorkbook } from '/assets/universal-sheet.js?v=3';
    FontResolver.shared().configure({ baseUrl: '/assets/fonts' });
    const us = document.getElementById('us');
    // "←" back to the site at the left of the editor's bar; shown only on phones (style.css)
    us.use({
      id: 'site.back',
      toolbar: ({ ui }) => ({
        compact: {
          leading: {
            id: 'site:back',
            widget: () => ({ el: ui.createBarButton({ icon: 'arrow_back', title: 'Back to site', variant: 'icon', onClick: () => { location.href = 'index.html'; } }) }),
          },
        },
      }),
    });
    try {
      const res = await fetch('/assets/samples/showcase.xlsx');
      if (!res.ok) throw new Error(`showcase.xlsx: ${res.status}`);
      await openWorkbook(us, new Uint8Array(await res.arrayBuffer()), 'showcase.xlsx');
    } catch (e) {
      console.error(e);
      us.newWorkbook();
    }
  </script>

</body>
</html>
