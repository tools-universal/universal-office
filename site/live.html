<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Universal Write — live editor</title>
  <meta name="description" content="Run the <universal-write> editor live in your browser — open, edit, and save .docx with rendering faithful to the reference application." />
  <link rel="icon" type="image/svg+xml" href="assets/icons/universal-office.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" />
  <link rel="stylesheet" href="assets/style.css" />
  <script src="assets/theme.js?v=2"></script>
  <style>
    html, body { height: 100%; margin: 0; }
    body { display: flex; flex-direction: column; overflow: hidden; }
    .live-bar {
      display: flex; align-items: center; gap: 12px;
      padding: 8px 16px; border-bottom: 1px solid var(--border);
      background: var(--bg); flex: none;
    }
    .live-bar .brand { display: flex; align-items: center; gap: 9px; font-weight: 700; color: var(--text); }
    .live-bar .brand img { width: 26px; height: 26px; display: block; }
    .live-bar .tag {
      font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em;
      color: var(--accent); background: var(--accent-soft); padding: 3px 9px; border-radius: 999px;
    }
    .live-bar .spacer { flex: 1; }
    .live-bar nav { display: flex; gap: 16px; align-items: center; }
    .live-bar nav a { color: var(--text-soft); font-size: 14px; font-weight: 600; }
    .live-bar nav a:hover { color: var(--text); text-decoration: none; }
    universal-write { display: block; flex: 1; min-height: 0; }
  </style>
</head>
<body>

  <div class="live-bar">
    <a class="brand" href="index.html">
      <img src="assets/icons/write.svg" alt="" />
      Universal Write
    </a>
    <span class="tag">Live</span>
    <span class="spacer"></span>
    <nav>
      <a href="docs/write/index.html">Documentation</a>
      <a href="index.html">← Back to site</a>
    </nav>
    <div class="theme-switch" role="group" aria-label="Theme">
      <button type="button" data-theme="auto" title="Auto (system)" aria-label="Auto theme"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg></button>
      <button type="button" data-theme="light" title="Light" aria-label="Light theme"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
      <button type="button" data-theme="dark" title="Dark" aria-label="Dark theme"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
    </div>
  </div>

  <universal-write id="ed" fonts="/assets/fonts" topbar bottombar></universal-write>

  <script type="module">
    import '/assets/universal-office.js?v=54';
    const bytesOf = async (u) => new Uint8Array(await (await fetch(u)).arrayBuffer());
    const ed = document.getElementById('ed');
    ed.addEventListener('uw-ready', async () => {
      try {
        ed.load(await bytesOf('/assets/samples/demo.docx'), 'auto', { protected: false });
      } catch (e) {
        console.error(e);
        ed.newDocument();
      }
      ed.focusEditor();
    });
  </script>

</body>
</html>
