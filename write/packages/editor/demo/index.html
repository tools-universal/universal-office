<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Write</title>
  <style>
    /* Fonte da interface: Poppins (subset latin do bundle Kûara) — as barras do
       componente a usam pela variável --uw-font. */
    @font-face { font-family:'Poppins'; font-style:normal; font-weight:400; font-display:swap; src:url('fonts/poppins-400.woff2') format('woff2'); }
    @font-face { font-family:'Poppins'; font-style:normal; font-weight:500; font-display:swap; src:url('fonts/poppins-500.woff2') format('woff2'); }
    @font-face { font-family:'Poppins'; font-style:normal; font-weight:600; font-display:swap; src:url('fonts/poppins-600.woff2') format('woff2'); }
    @font-face { font-family:'Poppins'; font-style:normal; font-weight:700; font-display:swap; src:url('fonts/poppins-700.woff2') format('woff2'); }
    html, body { margin: 0; height: 100%; }
    /* o demo só hospeda o componente: barras, menus, diálogos, comentários,
       comparação, tema e Modo Protegido vêm do próprio <universal-write> */
    universal-write { display: block; height: 100vh; --uw-font: "Poppins", "Segoe UI", system-ui, sans-serif; }
  </style>
</head>
<body>
  <universal-write id="wn" storage-key="write-demo" theme="auto" fonts="./fonts" topbar bottombar></universal-write>
  <script type="module" src="./bundle.js"></script>
</body>
</html>
